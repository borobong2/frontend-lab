<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>순수 JS 검색 화면 · frontend-lab</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="src/main.js"></script>
</head>
<body>
  <main>
    <header><p>frontend-lab / 실험 00</p><h1>React 없이 검색 화면 만들기</h1>
      <p>검색·필터·정렬을 바꾸며 데이터와 화면을 연결하는 책임을 찾아보세요.</p></header>
    <section aria-labelledby="controls-title">
      <h2 id="controls-title">상품 찾기</h2>
      <div class="controls">
        <label>상품명 <input id="query" type="search" placeholder="예: 키보드, USB" autocomplete="off"></label>
        <label>정렬 <select id="sort"><option value="default">기본 순서</option><option value="asc">가격 낮은 순</option><option value="desc">가격 높은 순</option></select></label>
        <label class="checkbox"><input id="stock" type="checkbox"> 재고 있는 상품만</label>
      </div>
    </section>
    <section aria-labelledby="results-title">
      <h2 id="results-title">검색 결과</h2>
      <p id="count" role="status" aria-live="polite" aria-atomic="true"></p>
      <p id="empty" hidden>조건에 맞는 상품이 없습니다. 검색어나 필터를 바꿔보세요.</p>
      <ul id="results"></ul>
    </section>
    <footer>메모는 이 페이지를 사용하는 동안만 유지됩니다. 새로고침하면 초기화됩니다.</footer>
    <noscript>이 실험의 검색 기능은 JavaScript를 켜야 사용할 수 있습니다.</noscript>
  </main>
</body>
</html>
